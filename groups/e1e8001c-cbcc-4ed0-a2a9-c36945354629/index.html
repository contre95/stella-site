    (function () {
      var PLAY_ICON  = '<svg viewBox="0 0 10 10" fill="currentColor" style="width:15px;height:15px;margin-left:2px"><path d="M2 1.5v7l6-3.5z"/></svg>';
      var PAUSE_ICON = '<svg viewBox="0 0 10 10" fill="currentColor" style="width:15px;height:15px"><rect x="1.5" y="1" width="2.5" height="8" rx="0.8"/><rect x="6" y="1" width="2.5" height="8" rx="0.8"/></svg>';

      window.stellaInitAudioPlayer = function (audioEl, idPrefix, suffix, opts) {
        opts = opts || {};
        var btn     = document.getElementById(idPrefix + 'play-btn-' + suffix);
        var track   = document.getElementById(idPrefix + 'track-' + suffix);
        var fill    = document.getElementById(idPrefix + 'fill-' + suffix);
        var cur     = document.getElementById(idPrefix + 'cur-' + suffix);
        var dur     = document.getElementById(idPrefix + 'dur-' + suffix);
        var wrapper = document.getElementById(idPrefix + 'player-' + suffix);
        if (!btn || !track) return;

        if (opts.stopTouchPropagation) {
          wrapper.addEventListener('touchstart', function (e) { e.stopPropagation(); }, { passive: true });
          wrapper.addEventListener('touchend', function (e) { e.stopPropagation(); });
        }

        function fmt(s) {
          if (!isFinite(s) || isNaN(s)) return '-:--';
          var m = Math.floor(s / 60), sec = Math.floor(s % 60);
          return m + ':' + (sec < 10 ? '0' : '') + sec;
        }
        function sync() {
          var pct = audioEl.duration ? (audioEl.currentTime / audioEl.duration) * 100 : 0;
          fill.style.width = pct + '%';
          if (cur) cur.textContent = fmt(audioEl.currentTime);
          if (dur) dur.textContent = fmt(audioEl.duration);
          btn.innerHTML = audioEl.paused ? PLAY_ICON : PAUSE_ICON;
          wrapper.classList.toggle('playing', !audioEl.paused);
        }

        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (audioEl.paused) audioEl.play().catch(function () {});
          else audioEl.pause();
        });
        track.addEventListener('click', function (e) {
          e.stopPropagation();
          if (!audioEl.duration) return;
          var rect = track.getBoundingClientRect();
          audioEl.currentTime = ((e.clientX - rect.left) / rect.width) * audioEl.duration;
        });
        audioEl.addEventListener('timeupdate', sync);
        audioEl.addEventListener('durationchange', sync);
        audioEl.addEventListener('play', sync);
        audioEl.addEventListener('pause', sync);
        audioEl.addEventListener('ended', function () { audioEl.currentTime = 0; sync(); });
        sync();
      };
    })();
  </script>

    window.stellaFitCardText = function (scrollEl, contentEl) {
      if (!scrollEl || !contentEl) return;
      contentEl.style.fontSize = '';
      var base = parseFloat(getComputedStyle(contentEl).fontSize) || 16;
      var isShort = contentEl.textContent.trim().length <= 3;
      var MAX_PX = 48; 
      var lo = 14, hi = isShort ? Math.min(base * 2, MAX_PX) : base;

      function fits(px) {
        contentEl.style.fontSize = px + 'px';
        return scrollEl.scrollHeight <= scrollEl.clientHeight + 1;
      }

      if (fits(hi)) { contentEl.style.fontSize = hi + 'px'; return; }
      if (!fits(lo)) { contentEl.style.fontSize = lo + 'px'; return; }
      for (var i = 0; i < 8; i++) {
        var mid = (lo + hi) / 2;
        if (fits(mid)) lo = mid; else hi = mid;
      }
      contentEl.style.fontSize = lo + 'px';
    };
  </script>

<script>
  
  
  
  window.swalGlass = Swal.mixin({ buttonsStyling: true });

  
  
  
  
  
  
  
  
  
  
  document.body.addEventListener('htmx:beforeSwap', function (evt) {
    if (evt.detail.xhr.status === 422) {
      evt.detail.shouldSwap = true;
      evt.detail.isError = false;
    }
  });

  
  window.humanBytes = function (n) {
    if (n < 1024) return n + ' B';
    var units = ['KB', 'MB', 'GB', 'TB'], v = n, i = -1;
    do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
    return Math.round(v) + ' ' + units[i];
  };

  
  
  
  
  window.pushToast = function (kind, msg) {
    var container = document.getElementById('toast-container');
    if (!container) return;
    var style = { ok: ['border-l-emerald-500', '3s'], err: ['border-l-red-500', '5s'], info: ['border-l-pink-500', '4s'] }[kind] || ['border-l-pink-500', '4s'];
    var div = document.createElement('div');
    div.className = 'glass flex items-center gap-2 rounded-xl border-l-4 ' + style[0] + ' px-4 py-2.5 text-sm font-medium text-gray-800 shadow-xl dark:text-gray-100';
    div.setAttribute('_', 'on load wait ' + style[1] + ' then transition opacity to 0 then remove me');
    div.textContent = msg;
    container.appendChild(div);
    if (window._hyperscript) _hyperscript.processNode(div);
  };

  
  
  function setInputFile(input, file) {
    var dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
  }

  
  
  function exceedsMaxBytes(form, size, label) {
    var max = parseInt(form.dataset.maxBytes, 10);
    if (max && size > max) {
      pushToast('err', 'That ' + label + ' is too large. Maximum upload size is ' + humanBytes(max) + '.');
      return true;
    }
    return false;
  }

  
  
  
  function initOnSwap(selector, init) {
    function run() { document.querySelectorAll(selector).forEach(init); }
    document.addEventListener('DOMContentLoaded', run);
    document.addEventListener('htmx:afterSwap', run);
  }

  
  
  
  
  window.guardImportSize = function (evt, inputId, formId) {
    var form = document.getElementById(formId);
    var file = document.getElementById(inputId).files[0];
    if (file && exceedsMaxBytes(form, file.size, 'file')) {
      evt.preventDefault();
    }
  };

  
  
  window.importDeckFromClipboard = async function (inputId, formId) {
    var text;
    try {
      text = await navigator.clipboard.readText();
    } catch (err) {
      pushToast('err', 'Could not read the clipboard: ' + err.message);
      return;
    }
    try {
      JSON.parse(text);
    } catch (err) {
      pushToast('err', 'Clipboard contents are not valid JSON.');
      return;
    }
    var form = document.getElementById(formId);
    if (exceedsMaxBytes(form, new Blob([text]).size, 'deck')) {
      return;
    }
    setInputFile(document.getElementById(inputId), new File([text], 'clipboard-deck.json', { type: 'application/json' }));
    form.requestSubmit();
  };

  
  document.addEventListener('htmx:confirm', function(e) {
    if (!e.detail.question) return;
    e.preventDefault();
    swalGlass.fire({
      title: 'Are you sure?',
      text: e.detail.question,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Confirm',
      cancelButtonText: 'Cancel',
    }).then(function(r) { if (r.isConfirmed) e.detail.issueRequest(true); });
  });

  
  
  
  
  
  document.body.addEventListener('htmx:responseError', function (e) {
    var xhr = e.detail.xhr;
    var tmp = document.createElement('div');
    tmp.innerHTML = xhr.responseText || '';
    var bubble = tmp.querySelector('#toast-container > div');
    if (bubble) {
      pushToast('err', bubble.textContent.trim());
    } else if (xhr.status === 413) {
      pushToast('err', 'That file is too large to import.');
    } else {
      pushToast('err', 'Something went wrong. Please try again.');
    }
  });
  document.body.addEventListener('htmx:sendError', function () {
    pushToast('err', 'Network error — please check your connection and try again.');
  });

  
  var _swipeMD = null;
  window.clSnapRow = function(node, dx) {
    var REVEAL = 72;
    if (Math.abs(dx) < 40) { node.style.transform = ''; node.style.transition = 'transform 0.2s ease'; return; }
    var snap = dx > 0 ? REVEAL : -REVEAL;
    node.style.transition = 'transform 0.2s ease';
    node.style.transform = 'translateX(' + snap + 'px)';
  };
  window.clMouseDown = function(e, node) {
    if (e.button !== 0) return;
    e.preventDefault();
    _swipeMD = { node: node, startX: e.clientX, moved: false };
    node.style.transition = 'none';
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'grabbing';
  };
  document.addEventListener('mousemove', function(e) {
    if (!_swipeMD) return;
    var dx = e.clientX - _swipeMD.startX;
    if (Math.abs(dx) > 4) _swipeMD.moved = true;
    if (_swipeMD.moved) _swipeMD.node.style.transform = 'translateX(' + dx + 'px)';
  });
  document.addEventListener('mouseup', function(e) {
    if (!_swipeMD) return;
    var node = _swipeMD.node;
    var dx = e.clientX - _swipeMD.startX;
    var moved = _swipeMD.moved;
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    _swipeMD = null;
    if (moved) clSnapRow(node, dx);
  });

  
  (function () {
    var player = new Audio();
    var active = null;
    function resetBtn(btn) {
      if (!btn) return;
      btn.classList.remove('playing');
      btn.style.setProperty('--p', '0%');
      btn.setAttribute('aria-label', 'Play audio');
    }
    player.addEventListener('timeupdate', function () {
      if (active && player.duration) {
        active.style.setProperty('--p', (player.currentTime / player.duration) * 100 + '%');
      }
    });
    player.addEventListener('ended', function () {
      resetBtn(active);
      active = null;
    });
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.audio-chip, .audio-pill');
      if (!btn) return;
      if (btn === active) {
        if (player.paused) {
          player.play();
          btn.classList.add('playing');
          btn.setAttribute('aria-label', 'Pause audio');
        } else {
          player.pause();
          btn.classList.remove('playing');
          btn.setAttribute('aria-label', 'Play audio');
        }
        return;
      }
      resetBtn(active);
      active = btn;
      player.src = btn.dataset.audio;
      player.play();
      btn.classList.add('playing');
      btn.setAttribute('aria-label', 'Pause audio');
    });
    
    document.body.addEventListener('htmx:afterSwap', function () {
      if (active && !document.contains(active)) {
        player.pause();
        active = null;
      }
    });
  })();

  
  (function () {
    if (!window.speechSynthesis) return;
    var current = null; 

    
    
    
    function spokenText(textEl) {
      var clone = textEl.cloneNode(true);
      clone.querySelectorAll('ruby').forEach(function (ruby) {
        var rt = ruby.querySelector('rt');
        ruby.replaceWith(rt ? rt.textContent : ruby.textContent);
      });
      return clone.textContent;
    }

    function stop() {
      speechSynthesis.cancel();
      if (current) current.classList.remove('speaking');
      current = null;
    }

    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.tts-btn');
      if (!btn) return;
      var wasCurrent = btn === current;
      stop();
      if (wasCurrent) return; 

      var wrap = btn.closest('.tts-wrap');
      var utter = new SpeechSynthesisUtterance(spokenText(wrap.querySelector('.tts-text')));
      utter.lang = wrap.dataset.ttsLang === 'ja' ? 'ja-JP' : 'en-US';
      utter.onend = utter.onerror = function () { if (current === btn) stop(); };
      current = btn;
      btn.classList.add('speaking');
      speechSynthesis.speak(utter);
    });

    
    document.body.addEventListener('htmx:afterSwap', stop);
  })();

  
  (function () {
    var MAX_SEC = 15;
    function fmt(s) { return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2); }

    function initWidget(widget) {
      if (widget._arInit) return;
      widget._arInit = true;

      var fileInput = widget.querySelector('input[type=file]');
      var ui = widget.querySelector('.rec-ui');
      var mr = null, chunks = [], blobUrl = null, elapsed = 0, ticker = null, fillEl = null;

      function btnCls(v) {
        var b = 'cursor-pointer rounded-lg border-0 px-3 py-1 text-xs font-semibold ';
        if (v==='rec')  return b+'bg-pink-500/15 text-pink-700 hover:bg-pink-500/25 dark:text-pink-300';
        if (v==='stop') return b+'bg-red-500/20 text-red-700 hover:bg-red-500/30 dark:text-red-300';
        if (v==='re')   return b+'bg-gray-200/60 text-gray-600 hover:bg-gray-300/60 dark:bg-white/10 dark:text-gray-300';
        return b;
      }

      function renderIdle() {
        fileInput.hidden = false;
        ui.innerHTML = '';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mt-1 text-xs font-medium text-pink-600 hover:text-pink-700 dark:text-pink-400 cursor-pointer';
        btn.textContent = 'Or record audio (max 15s)';
        btn.onclick = startRec;
        ui.appendChild(btn);
      }

      function renderRecording() {
        fileInput.hidden = true;
        ui.innerHTML = '';
        var row = document.createElement('div');
        row.className = 'mt-1.5 flex items-center gap-2';

        var stop = document.createElement('button');
        stop.type = 'button'; stop.textContent = '■ Stop'; stop.className = btnCls('stop');
        stop.onclick = stopRec;

        var timerEl = document.createElement('span');
        timerEl.className = 'text-xs tabular-nums text-gray-500 dark:text-gray-400';
        timerEl.textContent = fmt(0)+' / '+fmt(MAX_SEC);

        var bar = document.createElement('div');
        bar.className = 'h-1.5 flex-1 rounded-full bg-gray-200 dark:bg-white/10 overflow-hidden';
        fillEl = document.createElement('div');
        fillEl.className = 'h-full bg-pink-500';
        fillEl.style.width = '0%';
        bar.appendChild(fillEl);

        row.appendChild(stop); row.appendChild(timerEl); row.appendChild(bar);
        ui.appendChild(row);

        ticker = setInterval(function() {
          elapsed++;
          timerEl.textContent = fmt(elapsed)+' / '+fmt(MAX_SEC);
          if (fillEl) fillEl.style.width = (elapsed/MAX_SEC*100)+'%';
          if (elapsed >= MAX_SEC) stopRec();
        }, 1000);
      }

      function renderDone() {
        fileInput.hidden = true;
        ui.innerHTML = '';
        var row = document.createElement('div');
        row.className = 'mt-1.5 flex items-center gap-2 flex-wrap';

        var audio = document.createElement('audio');
        audio.src = blobUrl; audio.controls = true;
        audio.style.cssText = 'height:28px;flex:1;min-width:0';

        var reBtn = document.createElement('button');
        reBtn.type = 'button'; reBtn.textContent = '↺ Re-record'; reBtn.className = btnCls('re');
        reBtn.onclick = doReset;

        row.appendChild(audio); row.appendChild(reBtn);
        ui.appendChild(row);
      }

      function startRec() {
        
        Promise.resolve()
          .then(function() { return navigator.mediaDevices.getUserMedia({audio:true}); })
          .then(function(stream) {
            chunks = []; elapsed = 0; fillEl = null;
            mr = new MediaRecorder(stream);
            mr.ondataavailable = function(e) { if (e.data.size>0) chunks.push(e.data); };
            mr.onstop = function() {
              stream.getTracks().forEach(function(t){t.stop();});
              clearInterval(ticker);
              var blob = new Blob(chunks, {type: mr.mimeType||'audio/webm'});
              if (blobUrl) URL.revokeObjectURL(blobUrl);
              blobUrl = URL.createObjectURL(blob);
              setInputFile(fileInput, new File([blob], 'recording.webm', {type: blob.type}));
              renderDone();
            };
            mr.start();
            renderRecording();
          })
          .catch(function(err) {
            alert('Could not start recording: ' + (err && err.message ? err.message : err));
          });
      }

      function stopRec() {
        clearInterval(ticker);
        if (mr && mr.state !== 'inactive') mr.stop();
      }

      function doReset() {
        stopRec();
        if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
        chunks = []; elapsed = 0; mr = null; fillEl = null;
        try { fileInput.value = ''; } catch(e) {}
        renderIdle();
      }

      var form = widget.closest('form');
      if (form) form.addEventListener('reset', doReset);

      renderIdle();
    }

    initOnSwap('.audio-rec-widget', initWidget);
  })();

  
  
  
  (function () {
    function renderAll() {
      if (typeof katex === 'undefined') return;
      var rendered = false;
      document.querySelectorAll('.katex-math[data-tex]:not([data-rendered])').forEach(function (el) {
        el.dataset.rendered = '1';
        rendered = true;
        try {
          katex.render(el.dataset.tex, el, { displayMode: el.dataset.texDisplay === '1', throwOnError: false });
        } catch (e) {}
      });
      
      
      if (rendered && window.stellaRefitReviewCard) window.stellaRefitReviewCard();
    }
    document.addEventListener('DOMContentLoaded', renderAll);
    document.addEventListener('htmx:afterSwap', renderAll);
  })();

  
  
  (function () {
    function extFor(type) {
      if (type === 'image/jpeg') return '.jpg';
      if (type === 'image/gif')  return '.gif';
      if (type === 'image/webp') return '.webp';
      return '.png';
    }

    function imageFromClipboardEvent(e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
          return items[i].getAsFile();
        }
      }
      return null;
    }

    function initWidget(widget) {
      if (widget._ipInit) return;
      widget._ipInit = true;

      var fileInput = widget.querySelector('input[type=file]');
      var ui = widget.querySelector('.paste-ui');
      var previewUrl = null;

      function setFile(blob) {
        var type = blob.type || 'image/png';
        var name = blob.name || 'pasted-' + Date.now() + extFor(type);
        setInputFile(fileInput, new File([blob], name, {type: type}));
        renderPreview();
      }
      widget._ipSetFile = setFile;

      function renderIdle() {
        fileInput.hidden = false;
        if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
        ui.innerHTML = '';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mt-1 text-xs font-medium text-pink-600 hover:text-pink-700 dark:text-pink-400 cursor-pointer';
        btn.textContent = 'Or paste from clipboard';
        btn.onclick = pasteFromClipboard;
        ui.appendChild(btn);
      }

      function renderArmed() {
        fileInput.hidden = false;
        ui.innerHTML = '';
        var zone = document.createElement('div');
        zone.tabIndex = 0;
        zone.className = 'mt-1.5 rounded-xl border border-dashed border-pink-400/60 px-3 py-2 text-center text-xs text-pink-600 outline-none focus:ring-2 focus:ring-pink-500/40 dark:text-pink-300';
        zone.textContent = 'Press Ctrl+V to paste — Esc to cancel';
        zone.onkeydown = function (e) { if (e.key === 'Escape') renderIdle(); };
        zone.onblur = function () {
          
          setTimeout(function () { if (!fileInput.files.length && document.contains(zone)) renderIdle(); }, 200);
        };
        ui.appendChild(zone);
        zone.focus();
      }

      function renderPreview() {
        var f = fileInput.files && fileInput.files[0];
        if (!f) { renderIdle(); return; }
        fileInput.hidden = true;
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(f);
        ui.innerHTML = '';
        var row = document.createElement('div');
        row.className = 'mt-1.5 flex items-center gap-2';
        var img = document.createElement('img');
        img.src = previewUrl;
        img.className = 'h-12 w-12 rounded-lg object-cover ring-1 ring-black/10 dark:ring-white/10';
        var name = document.createElement('span');
        name.className = 'min-w-0 flex-1 truncate text-xs text-gray-500 dark:text-gray-400';
        name.textContent = f.name;
        var clear = document.createElement('button');
        clear.type = 'button';
        clear.textContent = '✕ Clear';
        clear.className = 'cursor-pointer rounded-lg border-0 bg-gray-200/60 px-3 py-1 text-xs font-semibold text-gray-600 hover:bg-gray-300/60 dark:bg-white/10 dark:text-gray-300';
        clear.onclick = doReset;
        row.appendChild(img); row.appendChild(name); row.appendChild(clear);
        ui.appendChild(row);
      }

      function pasteFromClipboard() {
        
        
        
        Promise.resolve()
          .then(function () { return navigator.clipboard.read(); })
          .then(function (items) {
            for (var i = 0; i < items.length; i++) {
              var types = items[i].types || [];
              for (var j = 0; j < types.length; j++) {
                if (types[j].indexOf('image/') === 0) {
                  return items[i].getType(types[j]).then(setFile);
                }
              }
            }
            renderArmed();
          })
          .catch(renderArmed);
      }

      function doReset() {
        if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
        try { fileInput.value = ''; } catch (e) {}
        renderIdle();
      }

      
      widget.addEventListener('paste', function (e) {
        var f = imageFromClipboardEvent(e);
        if (f) { e.preventDefault(); setFile(f); }
      });
      
      fileInput.addEventListener('change', renderPreview);

      var form = widget.closest('form');
      if (form) form.addEventListener('reset', function () { setTimeout(doReset, 0); });

      renderIdle();
    }

    
    
    document.addEventListener('paste', function (e) {
      var t = e.target;
      if (!t || (t.name !== 'front' && t.name !== 'back')) return;
      var f = imageFromClipboardEvent(e);
      if (!f) return;
      var form = t.closest('form');
      var input = form && form.querySelector('input[name=image_' + t.name + ']');
      var widget = input && input.closest('.image-paste-widget');
      if (widget && widget._ipSetFile) {
        e.preventDefault();
        widget._ipSetFile(f);
      }
    });

    initOnSwap('.image-paste-widget', initWidget);
  })();
</script>

  </body>
</html>
