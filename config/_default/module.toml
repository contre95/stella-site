# Module Configuration File
#
# This file configures Hugo module settings, particularly module mounts which
# define how content is organized within the project.
#
# Mounts specify file paths in your project that Hugo should use when building
# the site. They allow for custom directory structures and integrating content
# from different locations.

## content
[[mounts]]
  source = "content"
  target = "content"

# The docs pages come from the stella repo (scripts/fetch-stella.sh puts it
# at .stella). img/ comes along so pages can use relative image paths.
[[mounts]]
  source = ".stella/docs"
  target = "content/docs"
  # skills/ holds agent skill files (SKILL.md), not pages.
  files = ["! skills/**", "! *.yaml"]

## data
[[mounts]]
  source = "node_modules/@thulite/doks-core/data"
  target = "data"

[[mounts]]
  source = "data"
  target = "data"

## layouts
[[mounts]]
  source = "layouts"
  target = "layouts"

[[mounts]]
  # Exclude 'home.html' to avoid conflicts with custom home page layouts defined in the local 'layouts' directory.
  files = ["! home.html"]
  source = "node_modules/@thulite/doks-core/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/core/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/seo/layouts"
